                id: 1,
                title: "Avengers: Doomsday'de Harcanacak 5 Karakter",
                category: "Marvel",
                date: "8 Haziran 2026",
                summary: "Avengers: Doomsday, Marvel Sinematik Evreninin en büyük filmlerinden biri olacak. Ancak MCU’daki her büyük filmde olduğu gibi bu filmde de arka planda kalıp veya iyi kullanılamayıp, harcanan karakterler olacaktır. Bu yazıda filmde harcanacağını düşündüğüm beş karakteri konuşacağız",
                content: `
                    <p>Harcanacak karakter kavramını, biraz daha açmak istiyorum. Karakterlerin genellikle iki şekilde harcandığını düşünüyorum. İlki filmde hikayeye önemli bir katkısı olabilecekken çok az bir rolü olup, bir etki bırakaması. İkinci yolu ise filmde önemli bir role veya ekran süresine sahip olmasına rağmen karakteri olduğundan daha güçsüz göstermeleri. 
Bu açıklamalardan sonra Doomsday’de harcanacağını düşündüğüm ilk karaktere geçelim.</p>
                    <h3 class="text-xl font-bold text-white mt-4 mb-2">Loki</h3>
                    <p>Multiverse Saga’nın en önemli karakterlerinden biri olmasına rağmen Kang’in, Saga’nın ana kötü olmasından vazgeçildikten sonra bu filmdeki rolünün az olabileceğine dair söylentiler var. Ancak yine de şu anda evrendeki en güçlü karakterlerden biri, kendisini Doom’a karşı güçlü bir figür olarak görebilirdik. Maalesef göremeyeceğiz gibi, umuyorumki en azından karakteri kolay bir şekilde öldürmezler. Secret Wars’ta önemli bir rolü olursa Doomsday’de harcanmasını kabul edebilirim.</p>
                    <h3 class="text-xl font-bold text-white mt-4 mb-2">Thor</h3>
                    <p>Loki’deki durumun tam tersi söz konusu. Filmdeki ana karakterlerden biri olacak Thor. Ancak ben kendisinin güçsüz gösterileceğini düşünüyorum. CinemaCon’daki Avengers: Doomsday fragmanı da bu düşüncelerimi güçlendirdi. Doctor Doom’un ne kadar güçlü olduğunu göstermek için Thor’u harcayacaklarını düşünüyorum. En azından daha ciddi bir Thor göreceğiz, biraz daha lider pozisyonunda olabilir fragmana bakılırsa.</p>
                    <h3 class="text-xl font-bold text-white mt-4 mb-2">Bucky Barnes</h3>
                    <p>Belki New Avengers’ın lideri olarak görebilseydik Bucky’i, daha ön plana çıkabilirdi. Ancak takımın lideri Yelena gibi duruyor, Bucky en fazla co-leader olabilir. Sebastian Stan’in The Batman: Part II’de yer alacak olmasından dolayı karakterin öleceğini düşünenler fazla. Ben öleceğini düşünmüyorum ama ekip içerisinden Yelena ve Sentry’nin daha fazla kullanılacağını düşünüyorum.</p>
                    <h3 class="text-xl font-bold text-white mt-4 mb-2">Sam Wilson</h3>
                    <p>Filmi seyretmeden bile harcandığına emin olduğum tek karakter. Endgame’le beraber Captain America unvanı Sam Wilson’a geçmesine rağmen kendisini Captain America olarak adam akıllı ilk kez görebileceğimiz filmde, unvanın ilk sahibi Steve Rogers geri dönecek ve onun gölgesinde kalacak. Belki bu iki karakteri bir arada çok fazla görmeyeceğiz ama biz Sam Wilson, Captain America olarak daha önce çok görmedik. Kendi Avengers ekibini nasıl topladığını, onlara nasıl liderlik ettiğini daha önce görseydik iyi olabilirdi çünkü bu filmde bunları görmeyeceğimizi düşünüyorum.</p>
                    <h3 class="text-xl font-bold text-white mt-4 mb-2">Fantastic Four</h3>
                    <p>Evet, beş karakter demiştim ama Fantastic Four’dan kimi seçeceğimi bilemedim. Reed ve Sue daha ağır basıyordu ama ben bu aileyi ayırmak istemedim. Çizgi romanlarda olduğu gibi bu hikayenin Reed ve Doom husumetine bağlanmayacağı kesin gibi duruyor. Sue ve Doom arasında bir şey olmayacak herhalde çünkü Doom’un zaten bir ailesi olduğu ve onları kaybettiğine dair söylentiler var. Peki, Fantastic Four filmde olma sebebi ne? Sonraki sagada tanıtılamazlar mıydı? Filmdeki rolleri Doom’la aynı evrende olmaları olacak gibi duruyor, yine Steve Rogers’ın geri dönmesine aracı olacaklar gibi duruyor ama onlar olmadan yapabilirlerdi gibi. Johnny ve Ben’in daha da arka planda kalacağını düşünüyorum ama zaten çok büyük rollerinin de olması gerekmiyor bence. Sue ve Reed arasından da birini seçmem gerekse Reed derdim sanırım. Çünkü kaynak alınan hikayelere göre çok pasif kalıyor aslında bundan da çok şikayetçi değil çünkü Pedro Pascal’ın versiyonunu şimdilik çok beğenmedim. O yüzden Fantastic Four: First Steps’te olduğu gibi Sue Storm daha ön planda olursa şikayetçi olmam.</p>
                `

            {
                id: 2,
                title: "Spider-Man 4 Neden İptal Edildi, Hikayesi Nasıl Olacaktı? | İptal Edilen Projeler Serisi #1",
                category: "Marvel",
                date: "8 Haziran 2026",
                summary: "Bugün, iptal edilen Marvel projelerini konuşacağımız yeni bir seriye başlıyoruz. Bu projelerden en bilineniyle başlayalım Spider-Man 4. Çıkış tarihinin bile resmen duyurulduğu, yıllar sonra filmden konsept tasarımlarının da yayınlandığı film.",
                content: `
                    <p>Spider-Man tabii ki de 2000’lerde Marvel’ın en popüler karakteriydi. O yüzden her ne kadar üçüncü film, izleyicilerin büyük bir çoğunluğu tarafından ilk iki filmin seviyesinde bulunmamış olsa da dördüncü bir filmin geliştirilmesi çok normaldi.<p>
                    <p>Peki, film neden iptal oldu, veya film neyi anlatacaktı bunlara bakalım. Öncesinde biraz geriye gidersek Sam Raimi, Spider-Man 3'te kötü adam olarak Vulture'ı kullanmayı planlamıştı ancak Sony onu Venom'u kullanmaya zorladı. Raimi, Spider-Man 3'te Vulture'ı kullansaydı, Spider-Man 4'te kötü adamın Lizard olmasını planlamıştı.<p>
                    <p>Sam Raimi, Spider-Man 3'ün aldığı tepkilerden dolayı ilk iki filmde olduğu gibi çok daha küçük bir rota izlemeyi planladı. Kendisini tatmin edecek kadar tamamlanmış bir senaryo olmasa da, filmin ana konusunu üzerinde çizimler yapıldı. Çizer Jeffrey Henderson'a göre Kirsten Dunst'ın Mary-Jane Watson rolüne geri dönmesi planlanmıyordu. John Malkovich'in de 2009'da filmin kötüsü olarak Vulture'ı canlandıracağı doğrulanmıştı.<p>
                    <p>Şimdi filmin asıl hikayesine geçelim: Film, Peter Parker'ın Mary Jane’le ayrılıp kendisini tamamen Spider-Man olmaya adamasıyla ve Rhino, Stilt-Man, The Shocker, Mysterio, Shocker gibi kötü adamları alt ettiği bir montajla başlayacaktı.<p>
                    <p>The Daily Bugle'ın bir şirket tarafından satın alınacağı görülecekti ve bu sahneye ait çizimde yer alan kadın, Peter'ın yeni aşkı olacaktı. Adrian Toomes yani Vulture da, Peter'ın yeni aşkının da babası olacaktı. Vulture filmde o kadar tehlikeli ve güçlü gösterilecekti ki Spider-Man kendini kurtarmak için Vulture’ı öldürmek zorunda kalacaktı.<p>
                    <p>Üçüncü perdede ise Vulture'ın kızının onun yerine geçip Vulturess olması planlanıyordu. Bu karakteri canlandırmak için de Angelina Jolie'nin role talip olduğu belirtiliyor. Ayrıca filmde yer alacak bir diğer kadın karakter ise Anne Hathaway'in canlandıracağı Black Cat olacaktı.<p> 
                    <p>Şimdi burada bazı söylentilere göre şöyle bir durum var ki Felicia Hardy’nin Black Cat, Vulture’ın kızı ve daha sonrasında Vulturess olabileceğine dair haberler var ama kesin değil.<p>
                    <p>Film, Spider-Man ve Vulturess arasında yapılacak son bir savaşla doruğa ulaşacaktı. Bu savaş sırasında Black Cat’in Spider-Man’inin yanında yer alması, Vulturess’ın ise daha önce Sam Raimi’nin filmde yer alacağını söylediği Kraven the Hunter’ı işe alması planlanıyordu.<p>
                    <p>Spider-Man son savaşta ölecekti ve New York onun anısına bir anma töreni düzenleyecekti. Son sahnede ise küçük bir çocuğun anma töreninde bir Spider-Man oyuncağı düşürdüğü ve Peter Parker'ın onu kendisine geri verdiği görülüyordu.<p>
                    <p>Jenerik sonrası sahnesinde ise; Vulturess karakteri, kalabalığın arasında Peter'a bakıyordu. Böylece dördüncü film seri için bir son olacak ancak Sony’nin beşinci bir film istemesi durumunda zemin hazır olacaktı.<p>
                    <p>Filmin daha sonraki yıllarda çıkan filmlere benzerlik gösterdiğini söyleyebiliriz. Peter’ın sevdiği kişinin babasının Vulture çıkması, Spider-Man: Homecoming filminde kullanıldı. Filmin sonunun da The Dark Knight Rises’a benzediğini söyleyebiliriz.<p> 
                    <p>Bence böyle bir son seri için iyi olurdu, ancak Vulture ve Vulturess gibi karakterlerin ana kötü olduğu bir film beni heyecanlandırmazdı. Peki, film neden iptal oldu?<p>
                    <p>Daha önceden de söylediğim gibi Sam Raimi, Spider-Man 3’ün aldığı tepkilerden dolayı iyi bir film yapmak istiyordu. Bunun için de senaryo üç-dört kez tekrar yazıldı ancak Raimi son senaryodan da memnun kalmadı. Senaryo hazır olmamasına rağmen Sony de filmin çıkış tarihini ertelemek istemiyordu. Bunun üzerine Sam Raimi, Sony’ye “Mükemmel olmayan bir film yapmak istemiyorum, bu yüzden bence bu filmi yapmamalıyız. Zaten planladığınız reboot filminizi yapın. Dedi ve böylece Spider-Man 4 iptal edildi. Sony de Amazing Spider-Man serisini başlatma kararını aldı.<p>
                    <p>Ancak bunca geçen yıldan sonra seri bitmemiş olabilir. Spider-Man: No Way Home’daki dönüşlerinden sonra hem Tobey hem de Andrew’un yeni bir solo film alabilecekleri hep konuşuluyor. Son çıkan haberlerde de Tobey’nin dördüncü filminde hem baba, hem eş, hem de Spider-Man olmaya çalışan bir Peter Parker görebileceğimiz yazıldı. İptal edilen filmden çok daha ilgi çekici görünmekle birlikte solo filmi çıkmasa bile ben Tobey Maguire’ı Doomsday veya Secret Wars filmlerinde tekrar görme ihtimalimizi yüksek görüyorum.<p>
                `
            },

        /* YOUTUBE CANLI VERİ ÇEKME - KALİTE YÜKSELTME SİSTEMLİ */
        const YOUTUBE_CHANNEL_ID = "UCYdaRUfmpir19Tp3W4X8spg"; 
        
        async function fetchYouTubeVideos() {
            const videosContainer = document.getElementById('latest-videos-container');
            
            try {
                const rssUrl = encodeURIComponent(`https://www.youtube.com/feeds/videos.xml?channel_id=${YOUTUBE_CHANNEL_ID}`);
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;
                
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if (data.status === 'ok' && data.items.length > 0) {
                    const latestVideos = data.items.slice(0, 6); // 6 video çekiyoruz
                    
                    videosContainer.innerHTML = latestVideos.map(vid => {
                        const pubDate = new Date(vid.pubDate).toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
                        
                        // Video ID'sini Linkten Alıp En Yüksek Çözünürlüklü Fotoğrafı Çağırma Sistemi
                        const videoIdMatch = vid.link.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);
                        const videoId = videoIdMatch ? videoIdMatch[1] : null;
                        
                        // HD görsel URL'si (Bulunamazsa standart RSS resmi devreye girer)
                        const hdThumbnailUrl = videoId ? `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg` : vid.thumbnail;
                        const fallbackThumbnailUrl = videoId ? `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg` : vid.thumbnail;
                        
                        return `
                        <!-- max-w-[450px] ile kutuların maksimum genişliğini daralttık -->
                        <a href="${vid.link}" target="_blank" class="group bg-gray-900 border border-gray-800 rounded-lg overflow-hidden hover:border-gray-500 transition flex flex-col w-full max-w-[450px]">
                            <div class="relative aspect-video w-full overflow-hidden bg-black">
                                <img src="${hdThumbnailUrl}" onerror="this.onerror=null; this.src='${fallbackThumbnailUrl}';" alt="${vid.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                                    <i class="fa-brands fa-youtube text-5xl text-red-600 drop-shadow-md"></i>
                                </div>
                            </div>
                            <div class="p-4 flex flex-col flex-grow">
                                <h3 class="font-bold text-gray-200 group-hover:text-white line-clamp-2 mb-2 text-lg md:text-xl">${vid.title}</h3>
                                <span class="text-sm text-gray-500 mt-auto"><i class="fa-regular fa-clock mr-1"></i>${pubDate}</span>
                            </div>
                        </a>
                        `
                    }).join('');
                } else {
                    videosContainer.innerHTML = `<div class="col-span-full text-center py-6 text-gray-500">Videolar şu an yüklenemedi.</div>`;
                }
            } catch (error) {
                console.error("YouTube veri çekme hatası:", error);
                videosContainer.innerHTML = `
                    <div class="col-span-full text-center py-6 text-gray-500">Videolar yüklenirken bir sorun oluştu.</div>`;
            }
        }

/* =========================================
           3. SAYFA VE SEKME İŞLEVLERİ
           ========================================= */
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            window.scrollTo(0,0);
        }

        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        
        function toggleMobileMenu() {
            mobileMenu.classList.toggle('hidden');
        }
        mobileMenuBtn.addEventListener('click', toggleMobileMenu);

        function loadHomeContent() {
            fetchYouTubeVideos();
            loadLatestArticlesCarousel();
        }

        function loadLatestArticlesCarousel() {
            const marqueeContainer = document.getElementById('latest-articles-marquee');
            if(articlesData.length === 0) {
                marqueeContainer.innerHTML = '<div class="text-gray-500 p-4">Henüz yazı bulunmuyor.</div>';
                return;
            }

            const articlesHTML = articlesData.map(article => `
                <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 hover:border-gray-500 transition flex flex-col cursor-pointer w-[300px] shrink-0 whitespace-normal" onclick="openArticle(${article.id})">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded uppercase">${article.category}</span>
                        <span class="text-[10px] text-gray-500">${article.date}</span>
                    </div>
                    <h3 class="text-lg font-bold mb-2 text-gray-100 line-clamp-2">${article.title}</h3>
                    <p class="text-gray-400 text-sm mb-4 line-clamp-3 overflow-hidden text-ellipsis">${article.summary}</p>
                    <div class="mt-auto text-xs font-bold text-gray-300">Şimdi Oku &rarr;</div>
                </div>
            `).join('');

            marqueeContainer.innerHTML = articlesHTML.repeat(4);
        }

        function goToCategory(category) {
            switchTab('articles');
            filterArticles(category);
        }

        function filterArticles(category) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                if(btn.innerText === category) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            const filteredData = category === 'Tümü' 
                ? articlesData 
                : articlesData.filter(article => article.category === category);

            const articlesContainer = document.getElementById('articles-container');
            if(filteredData.length === 0) {
                articlesContainer.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500">Bu kategoride henüz yazı bulunmuyor.</div>`;
                return;
            }
            
            // EKSİK OLAN LİSTELEME BÖLÜMÜ EKLENDİ
            articlesContainer.innerHTML = filteredData.map(article => `
                <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 hover:border-gray-500 transition flex flex-col h-full cursor-pointer" onclick="openArticle(${article.id})">
                    <div class="flex items-center gap-2 mb-4">
                        <span class="bg-red-600 text-white text-xs font-bold px-2 py-1 rounded uppercase">${article.category}</span>
                        <span class="text-xs text-gray-500">${article.date}</span>
                    </div>
                    <h3 class="text-xl font-bold mb-3 text-gray-100">${article.title}</h3>
                    <p class="text-gray-400 text-sm mb-6 flex-grow">${article.summary}</p>
                    <button class="text-left text-sm font-bold text-gray-300 hover:text-white mt-auto flex items-center">
                        Devamını Oku <i class="fa-solid fa-arrow-right ml-2 text-xs"></i>
                    </button>
                </div>
            `).join('');
        } // FONKSİYONU KAPATAN EKSİK PARANTEZ EKLENDİ

        /* YAZI OKUMA VE PAYLAŞMA SİSTEMİ */
        function openArticle(id) {
            currentOpenArticleId = id;
            const article = articlesData.find(a => a.id === id);
            if(!article) return;

            document.getElementById('modal-category').innerText = article.category;
            document.getElementById('modal-date').innerText = article.date;
            document.getElementById('modal-title').innerText = article.title;
            document.getElementById('modal-content').innerHTML = article.content;
            
            document.getElementById('article-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            // URL'yi değiştir (Sayfa yenilenmeden linkin sonuna #yazi-1 gibi ekleme yapar)
            try {
                window.location.hash = 'yazi-' + id;
            } catch (e) {
                console.log("Önizleme modunda URL değiştirme işlemi güvenlik nedeniyle atlandı.");
            }
        }

        function closeArticle() {
            currentOpenArticleId = null;
            document.getElementById('article-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';

            // URL'den #yazi etiketini temizle
            try {
                window.location.hash = '';
            } catch (e) {
                console.log("Önizleme modunda URL değiştirme işlemi güvenlik nedeniyle atlandı.");
            }
        }

        // Paylaşma Fonksiyonu (Bağlantı Kopyalama)
        async function shareArticle() {
            const article = articlesData.find(a => a.id === currentOpenArticleId);
            if (!article) return;

            // Paylaşılacak tam link (örn: dyml02.github.io/#yazi-1)
            const shareUrl = window.location.href; 
            const shareBtn = document.querySelector('button[onclick="shareArticle()"]');
            const originalHTML = shareBtn.innerHTML;

            try {
                // Sadece bağlantıyı panoya kopyala
                await navigator.clipboard.writeText(shareUrl);
                
                // Başarı mesajı göster
                shareBtn.innerHTML = '<i class="fa-solid fa-check"></i> Kopyalandı!';
                shareBtn.classList.add('text-green-400');
                
                setTimeout(() => {
                    shareBtn.innerHTML = originalHTML;
                    shareBtn.classList.remove('text-green-400');
                }, 2000);
            } catch (err) {
                // Kopyalama başarısız olursa manuel yöntem
                const tempInput = document.createElement('input');
                tempInput.value = shareUrl;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                
                shareBtn.innerHTML = '<i class="fa-solid fa-check"></i> Kopyalandı!';
                shareBtn.classList.add('text-green-400');
                
                setTimeout(() => {
                    shareBtn.innerHTML = originalHTML;
                    shareBtn.classList.remove('text-green-400');
                }, 2000);
            }
        }

        /* BAŞLANGIÇ AYARLARI */
        window.onload = () => {
            loadHomeContent();
            filterArticles('Tümü');

            // Eğer siteye dışarıdan linkle (örn: dyml02.github.io/#yazi-2) gelindiyse yazıyı otomatik aç
            const hash = window.location.hash;
            if (hash.startsWith('#yazi-')) {
                const articleId = parseInt(hash.replace('#yazi-', ''));
                if (!isNaN(articleId)) {
                    switchTab('articles');
                    openArticle(articleId);
                }
            }
        };

    </script>
