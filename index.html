<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DYML02 - YouTube, İnceleme ve Yazılar</title>
    <!-- Tailwind CSS (Tasarım için) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome (İkonlar için) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Özelleştirilmiş Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        
        .tab-content { display: none; animation: fadeIn 0.3s ease-in-out; }
        .tab-content.active { display: block; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .category-btn.active {
            background-color: #dc2626; /* Kanalın Kırmızısı */
            color: #fff;
            border-color: #dc2626;
        }

        /* Gizli Scrollbar ve Kayan Animasyon */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .marquee-container {
            overflow: hidden;
            display: flex;
            width: 100%;
            position: relative;
        }
        .marquee-content {
            display: flex;
            animation: marquee 30s linear infinite;
        }
        .marquee-content:hover {
            animation-play-state: paused; /* Üzerine gelince durur */
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); } 
        }

        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #dc2626;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-black text-white font-sans antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="border-b border-gray-800 sticky top-0 bg-black/90 backdrop-blur-sm z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <!-- Logo -->
            <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('home')">
                <span class="text-2xl font-black tracking-widest uppercase text-white">DYML<span class="text-red-600">02</span></span>
            </div>

            <!-- Desktop Menu -->
            <div class="hidden md:flex space-x-6 items-center">
                <button onclick="switchTab('home')" class="hover:text-gray-300 transition"><i class="fa-solid fa-house mr-1"></i> Anasayfa</button>
                <button onclick="switchTab('articles')" class="hover:text-gray-300 transition"><i class="fa-solid fa-pen-nib mr-1"></i> Yazılar & İncelemeler</button>
                <a href="https://youtube.com/@dyml02?si=ZNMfUxWa4Rv81iMf" target="_blank" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-md font-bold transition flex items-center gap-2">
                    <i class="fa-brands fa-youtube"></i> Kanala Git
                </a>
            </div>

            <!-- Mobile Menu Button -->
            <div class="md:hidden flex items-center">
                <button id="mobile-menu-btn" class="text-2xl focus:outline-none"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>
        
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-gray-900 border-b border-gray-800">
            <div class="flex flex-col p-4 space-y-4">
                <button onclick="switchTab('home'); toggleMobileMenu()" class="text-left"><i class="fa-solid fa-house mr-2"></i> Anasayfa</button>
                <button onclick="switchTab('articles'); toggleMobileMenu()" class="text-left"><i class="fa-solid fa-pen-nib mr-2"></i> Yazılar</button>
                <a href="https://youtube.com/@dyml02?si=ZNMfUxWa4Rv81iMf" target="_blank" class="text-red-500 font-bold"><i class="fa-brands fa-youtube mr-2"></i> YouTube Kanalı</a>
            </div>
        </div>
    </nav>

    <!-- Ana İçerik Alanı -->
    <main class="flex-grow container mx-auto px-4 py-8">

        <!-- ANASAYFA SEKMESİ -->
        <div id="home" class="tab-content active">
            
            <!-- Kategorilere Hızlı Erişim -->
            <div class="mb-10">
                <div class="flex overflow-x-auto hide-scrollbar gap-3 pb-2 snap-x">
                    <button onclick="goToCategory('Dizi')" class="snap-start whitespace-nowrap bg-red-600 hover:bg-red-700 text-white transition px-6 py-3 rounded-xl font-bold text-base md:text-lg flex-1 text-center shadow-lg shadow-red-900/20">Dizi</button>
                    <button onclick="goToCategory('Film')" class="snap-start whitespace-nowrap bg-red-600 hover:bg-red-700 text-white transition px-6 py-3 rounded-xl font-bold text-base md:text-lg flex-1 text-center shadow-lg shadow-red-900/20">Film</button>
                    <button onclick="goToCategory('Oyun')" class="snap-start whitespace-nowrap bg-red-600 hover:bg-red-700 text-white transition px-6 py-3 rounded-xl font-bold text-base md:text-lg flex-1 text-center shadow-lg shadow-red-900/20">Oyun</button>
                    <button onclick="goToCategory('WWE')" class="snap-start whitespace-nowrap bg-red-600 hover:bg-red-700 text-white transition px-6 py-3 rounded-xl font-bold text-base md:text-lg flex-1 text-center shadow-lg shadow-red-900/20">WWE</button>
                    <button onclick="goToCategory('DC')" class="snap-start whitespace-nowrap bg-red-600 hover:bg-red-700 text-white transition px-6 py-3 rounded-xl font-bold text-base md:text-lg flex-1 text-center shadow-lg shadow-red-900/20">DC</button>
                    <button onclick="goToCategory('Marvel')" class="snap-start whitespace-nowrap bg-red-600 hover:bg-red-700 text-white transition px-6 py-3 rounded-xl font-bold text-base md:text-lg flex-1 text-center shadow-lg shadow-red-900/20">Marvel</button>
                    <button onclick="goToCategory('Nasıldı?')" class="snap-start whitespace-nowrap bg-red-600 hover:bg-red-700 text-white transition px-6 py-3 rounded-xl font-bold text-base md:text-lg flex-1 text-center shadow-lg shadow-red-900/20">Nasıldı?</button>
                </div>
            </div>

            <!-- Hareketli Son Yazılar Paneli -->
            <div class="mb-12">
                <div class="flex justify-between items-end mb-6 border-b border-gray-800 pb-2">
                    <h2 class="text-2xl font-bold">Son Yazılar ve İncelemeler</h2>
                    <button onclick="switchTab('articles')" class="text-sm text-gray-400 hover:text-white transition">Tümünü Gör</button>
                </div>
                
                <div class="marquee-container">
                    <div class="marquee-content gap-4" id="latest-articles-marquee">
                        <!-- Yazılar js ile buraya eklenecek -->
                    </div>
                </div>
            </div>

            <!-- Son Videolar -->
            <div>
                <div class="flex justify-between items-end mb-6 border-b border-gray-800 pb-2">
                    <h2 class="text-2xl font-bold"><i class="fa-solid fa-video mr-2 text-red-500"></i> Son Videolar</h2>
                    <a href="https://www.youtube.com/@DYML02/videos" target="_blank" class="text-sm text-gray-400 hover:text-white transition">Tümünü Gör</a>
                </div>
                
                <!-- Videolar - Her satırda 2 adet olacak, merkezlenecek ve boyutları küçültülecek -->
                <div id="latest-videos-container" class="grid grid-cols-1 md:grid-cols-2 gap-8 justify-items-center">
                    <div class="col-span-full text-center py-10">
                        <div class="loading-spinner"></div>
                        <p class="text-gray-500 mt-2 text-sm">YouTube'dan en son videolar çekiliyor...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- YAZILAR & İNCELEMELER SEKMESİ -->
        <div id="articles" class="tab-content">
            <h2 class="text-3xl font-bold mb-6 text-center md:text-left"><i class="fa-solid fa-newspaper mr-2"></i> İncelemeler ve Yazılar</h2>
            
            <div class="flex flex-wrap gap-2 mb-8 border-b border-gray-800 pb-4" id="category-filters">
                <button onclick="filterArticles('Tümü')" class="category-btn active px-4 py-2 rounded-full border border-gray-700 hover:bg-gray-800 transition text-sm font-medium">Tümü</button>
                <button onclick="filterArticles('Dizi')" class="category-btn px-4 py-2 rounded-full border border-gray-700 hover:bg-gray-800 transition text-sm font-medium">Dizi</button>
                <button onclick="filterArticles('Film')" class="category-btn px-4 py-2 rounded-full border border-gray-700 hover:bg-gray-800 transition text-sm font-medium">Film</button>
                <button onclick="filterArticles('Oyun')" class="category-btn px-4 py-2 rounded-full border border-gray-700 hover:bg-gray-800 transition text-sm font-medium">Oyun</button>
                <button onclick="filterArticles('WWE')" class="category-btn px-4 py-2 rounded-full border border-gray-700 hover:bg-gray-800 transition text-sm font-medium">WWE</button>
                <button onclick="filterArticles('DC')" class="category-btn px-4 py-2 rounded-full border border-gray-700 hover:bg-gray-800 transition text-sm font-medium">DC</button>
                <button onclick="filterArticles('Marvel')" class="category-btn px-4 py-2 rounded-full border border-gray-700 hover:bg-gray-800 transition text-sm font-medium">Marvel</button>
                <button onclick="filterArticles('Nasıldı?')" class="category-btn px-4 py-2 rounded-full border border-gray-700 hover:bg-gray-800 transition text-sm font-medium">Nasıldı?</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="articles-container"></div>
        </div>

        <!-- YAZI OKUMA MODALI -->
        <div id="article-modal" class="fixed inset-0 bg-black/90 z-[60] hidden overflow-y-auto pt-20 pb-10 px-4">
            <div class="max-w-3xl mx-auto bg-gray-900 border border-gray-700 rounded-xl p-6 md:p-10 relative">
                <button onclick="closeArticle()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <div class="mb-4 flex items-center gap-3">
                    <span id="modal-category" class="bg-white text-black text-xs font-bold px-2 py-1 rounded uppercase"></span>
                    <span id="modal-date" class="text-sm text-gray-400"></span>
                </div>
                <h1 id="modal-title" class="text-3xl md:text-4xl font-bold mb-6"></h1>
                <div id="modal-content" class="prose prose-invert max-w-none text-gray-300 leading-relaxed space-y-4"></div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-800 py-8 mt-10">
        <div class="container mx-auto px-4 text-center">
            <span class="text-2xl font-black tracking-widest uppercase text-white inline-block mb-4">DYML<span class="text-red-600">02</span></span>
            <p class="text-gray-500 mb-4">&copy; <span id="currentYear"></span> DYML02. Tüm hakları saklıdır.</p>
            <div class="flex justify-center space-x-6 text-2xl">
                <a href="https://youtube.com/@dyml02?si=ZNMfUxWa4Rv81iMf" target="_blank" class="text-gray-400 hover:text-red-500 transition"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://twitter.com/02DYML02" target="_blank" class="text-gray-400 hover:text-blue-400 transition"><i class="fa-brands fa-twitter"></i></a>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        /* YAZILARINIZI BURAYA EKLEYİNİZ */
        const articlesData = [
            {
                id: 1,
                title: "Loki 2. Sezon İncelemesi: Beklentileri Karşıladı mı?",
                category: "Marvel",
                date: "10 Kasım 2023",
                summary: "Marvel Sinematik Evreni'nin sevilen dizisi Loki'nin 2. sezon finalini detaylıca masaya yatırıyoruz.",
                content: `
                    <p>Loki'nin ikinci sezonu nihayet sona erdi ve ardında konuşulacak çok fazla şey bıraktı. İlk sezonun yarattığı devasa çoklu evren beklentisinden sonra, bu sezon daha çok TVA'in iç dinamiklerine ve karakterlerin kişisel gelişimlerine odaklandı.</p>
                    <p>Özellikle Tom Hiddleston'ın performansı her zamanki gibi büyüleyiciydi. Ancak sezonun asıl parlayan yıldızı Ke Huy Quan'ın canlandırdığı O.B. karakteri oldu.</p>
                    <h3 class="text-xl font-bold text-white mt-4 mb-2">Final Nasıldı?</h3>
                    <p>Final bölümü, MCU'nun son yıllarda gördüğü en epik sahnelerden birine ev sahipliği yaptı. Loki'nin 'Kutsal Zaman Çizgisi' için yaptığı fedakarlık...</p>
                `
            },
            {
                id: 2,
                title: "The Batman: Nasıldı?",
                category: "Nasıldı?",
                date: "20 Ekim 2023",
                summary: "Matt Reeves'in yönettiği ve Robert Pattinson'ın başrolde olduğu The Batman filmini karanlık atmosferiyle inceliyoruz.",
                content: `
                    <p>DC evreninin en yeni ve belki de en karanlık yorumlarından biri olan The Batman'i izledik. Nasıldı?</p>
                    <p>Film, süper kahraman filminden çok bir dedektiflik ve neo-noir suç gerilimi hissiyatı veriyor. Gotham şehri hiç bu kadar çürümüş ve gerçekçi hissettirmemişti.</p>
                `
            }
        ];

        /* YOUTUBE CANLI VERİ ÇEKME - KALİTE YÜKSELTME SİSTEMLİ */
        const YOUTUBE_CHANNEL_ID = "UCYdaRUfmpir19Tp3W4X8spg"; 
        
        async function fetchYouTubeVideos() {
            const videosContainer = document.getElementById('latest-videos-container');
            
            try {
                const rssUrl = encodeURIComponent(`https://www.youtube.com/feeds/videos.xml?channel_id=${YOUTUBE_CHANNEL_ID}`);
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;
                
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if (data.status === 'ok' && data.items.length > 0) {
                    const latestVideos = data.items.slice(0, 6); // 6 video çekiyoruz
                    
                    videosContainer.innerHTML = latestVideos.map(vid => {
                        const pubDate = new Date(vid.pubDate).toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
                        
                        // Video ID'sini Linkten Alıp En Yüksek Çözünürlüklü Fotoğrafı Çağırma Sistemi
                        const videoIdMatch = vid.link.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);
                        const videoId = videoIdMatch ? videoIdMatch[1] : null;
                        
                        // HD görsel URL'si (Bulunamazsa standart RSS resmi devreye girer)
                        const hdThumbnailUrl = videoId ? `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg` : vid.thumbnail;
                        const fallbackThumbnailUrl = videoId ? `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg` : vid.thumbnail;
                        
                        return `
                        <!-- max-w-[450px] ile kutuların maksimum genişliğini daralttık -->
                        <a href="${vid.link}" target="_blank" class="group bg-gray-900 border border-gray-800 rounded-lg overflow-hidden hover:border-gray-500 transition flex flex-col w-full max-w-[450px]">
                            <div class="relative aspect-video w-full overflow-hidden bg-black">
                                <img src="${hdThumbnailUrl}" onerror="this.onerror=null; this.src='${fallbackThumbnailUrl}';" alt="${vid.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                                    <i class="fa-brands fa-youtube text-5xl text-red-600 drop-shadow-md"></i>
                                </div>
                            </div>
                            <div class="p-4 flex flex-col flex-grow">
                                <h3 class="font-bold text-gray-200 group-hover:text-white line-clamp-2 mb-2 text-lg md:text-xl">${vid.title}</h3>
                                <span class="text-sm text-gray-500 mt-auto"><i class="fa-regular fa-clock mr-1"></i>${pubDate}</span>
                            </div>
                        </a>
                        `
                    }).join('');
                } else {
                    videosContainer.innerHTML = `<div class="col-span-full text-center py-6 text-gray-500">Videolar şu an yüklenemedi.</div>`;
                }
            } catch (error) {
                console.error("YouTube veri çekme hatası:", error);
                videosContainer.innerHTML = `
                    <div class="col-span-full text-center py-6 text-gray-500">Videolar yüklenirken bir sorun oluştu.</div>`;
            }
        }

        /* SAYFA İŞLEVLERİ */
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            window.scrollTo(0,0);
        }

        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        
        function toggleMobileMenu() {
            mobileMenu.classList.toggle('hidden');
        }
        mobileMenuBtn.addEventListener('click', toggleMobileMenu);

        function loadHomeContent() {
            fetchYouTubeVideos();
            loadLatestArticlesCarousel();
        }

        function loadLatestArticlesCarousel() {
            const marqueeContainer = document.getElementById('latest-articles-marquee');
            
            if(articlesData.length === 0) {
                marqueeContainer.innerHTML = '<div class="text-gray-500 p-4">Henüz yazı bulunmuyor.</div>';
                return;
            }

            const articlesHTML = articlesData.map(article => `
                <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 hover:border-gray-500 transition flex flex-col cursor-pointer w-[300px] shrink-0 whitespace-normal" onclick="openArticle(${article.id})">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded uppercase">${article.category}</span>
                        <span class="text-[10px] text-gray-500">${article.date}</span>
                    </div>
                    <h3 class="text-lg font-bold mb-2 text-gray-100 line-clamp-2">${article.title}</h3>
                    <p class="text-gray-400 text-sm mb-4 line-clamp-3 overflow-hidden text-ellipsis">${article.summary}</p>
                    <div class="mt-auto text-xs font-bold text-gray-300">İncelemeyi Oku &rarr;</div>
                </div>
            `).join('');

            marqueeContainer.innerHTML = articlesHTML.repeat(4);
        }

        function goToCategory(category) {
            switchTab('articles');
            filterArticles(category);
        }

        function filterArticles(category) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                if(btn.innerText === category) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            const filteredData = category === 'Tümü' 
                ? articlesData 
                : articlesData.filter(article => article.category === category);

            const articlesContainer = document.getElementById('articles-container');
            
            if(filteredData.length === 0) {
                articlesContainer.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500">Bu kategoride henüz yazı bulunmuyor.</div>`;
                return;
            }

            articlesContainer.innerHTML = filteredData.map(article => `
                <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 hover:border-gray-500 transition flex flex-col h-full cursor-pointer" onclick="openArticle(${article.id})">
                    <div class="flex items-center gap-2 mb-4">
                        <span class="bg-red-600 text-white text-xs font-bold px-2 py-1 rounded uppercase">${article.category}</span>
                        <span class="text-xs text-gray-500">${article.date}</span>
                    </div>
                    <h3 class="text-xl font-bold mb-3 text-gray-100">${article.title}</h3>
                    <p class="text-gray-400 text-sm mb-6 flex-grow">${article.summary}</p>
                    <button class="text-left text-sm font-bold text-gray-300 hover:text-white mt-auto flex items-center">
                        Devamını Oku <i class="fa-solid fa-arrow-right ml-2 text-xs"></i>
                    </button>
                </div>
            `).join('');
        }

        function openArticle(id) {
            const article = articlesData.find(a => a.id === id);
            if(!article) return;

            document.getElementById('modal-category').innerText = article.category;
            document.getElementById('modal-date').innerText = article.date;
            document.getElementById('modal-title').innerText = article.title;
            document.getElementById('modal-content').innerHTML = article.content;
            
            document.getElementById('article-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeArticle() {
            document.getElementById('article-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        window.onload = () => {
            loadHomeContent();
            filterArticles('Tümü');
        };

    </script>
</body>
</html>
