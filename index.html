        /* =========================================
           1. YAZI İSİMLERİNİ URL'YE UYGUN HALE GETİRME (SLUGIFY)
           Örn: "Yeni Bölüm Nasıldı?" -> "yeni-bolum-nasildi"
           ========================================= */
        function createSlug(title) {
            let str = title.replace(/^\s+|\s+$/g, '').toLowerCase();

            // Türkçe karakterleri ve aksanları İngilizce karakterlere çevir
            const charMap = {
                'ğ': 'g', 'ü': 'u', 'ş': 's', 'ı': 'i', 'ö': 'o', 'ç': 'c',
                'Ğ': 'g', 'Ü': 'u', 'Ş': 's', 'İ': 'i', 'Ö': 'o', 'Ç': 'c'
            };
            
            str = str.replace(/[ğüşıöçĞÜŞİÖÇ]/g, function(match) {
                return charMap[match];
            });

            str = str.replace(/[^a-z0-9 -]/g, '') // Alfanümerik olmayanları sil
                     .replace(/\s+/g, '-') // Boşlukları tireye çevir
                     .replace(/-+/g, '-'); // Fazla tireleri tek tire yap

            return str;
        }

Bu açıklamalardan sonra Doomsday’de harcanacağını düşündüğüm ilk karaktere geçelim.</p>
                    <h3 class="text-xl font-bold text-white mt-4 mb-2">Loki</h3>
                    <p>Multiverse Saga’nın en önemli karakterlerinden biri olmasına rağmen Kang’in, Saga’nın ana kötü olmasından vazgeçildikten sonra bu filmdeki rolünün az olabileceğine dair söylentiler var. Ancak yine de şu anda evrendeki en güçlü karakterlerden biri, kendisini Doom’a karşı güçlü bir figür olarak görebilirdik. Maalesef göremeyeceğiz gibi, umuyorumki en azından karakteri kolay bir şekilde öldürmezler. Secret Wars’ta önemli bir rolü olursa Doomsday’de harcanmasını kabul edebilirim.</p>

                    <p>Filmi seyretmeden bile harcandığına emin olduğum tek karakter. Endgame’le beraber Captain America unvanı Sam Wilson’a geçmesine rağmen kendisini Captain America olarak adam akıllı ilk kez görebileceğimiz filmde, unvanın ilk sahibi Steve Rogers geri dönecek ve onun gölgesinde kalacak. Belki bu iki karakteri bir arada çok fazla görmeyeceğiz ama biz Sam Wilson, Captain America olarak daha önce çok görmedik. Kendi Avengers ekibini nasıl topladığını, onlara nasıl liderlik ettiğini daha önce görseydik iyi olabilirdi çünkü bu filmde bunları görmeyeceğimizi düşünüyorum.</p>

                    <p>Sam Raimi, Spider-Man 3'ün aldığı tepkilerden dolayı ilk iki filmde olduğu gibi çok daha küçük bir rota izlemeyi planladı. Kendisini tatmin edecek kadar tamamlanmış bir senaryo olmasa da, filmin ana konusunu üzerinde çizimler yapıldı. Çizer Jeffrey Henderson'a göre Kirsten Dunst'ın Mary-Jane Watson rolüne geri dönmesi planlanmıyordu. John Malkovich'in de 2009'da filmin kötüsü olarak Vulture'ı canlandıracağı doğrulanmıştı.<p>

                    "Temmuz": 6, "Ağustos": 7, "Eylül": 8, "Ekim": 9, "Kasım": 10, "Aralık": 11
                };
                
                const parseDate = (dateStr) => {
                    const parts = dateStr.split(' ');
                    if (parts.length === 3) {
                        return new Date(parseInt(parts[2]), months[parts[1]], parseInt(parts[0])).getTime();
                    }
                    return 0;
                };

                const dateA = parseDate(a.date);
                const dateB = parseDate(b.date);
                
                // Tarihler aynıysa (Örn: Aynı gün 3 yazı paylaşıldıysa) ID'si büyük olanı (en son ekleneni) üste koy
                if (dateB === dateA) {
                    return b.id - a.id; 
                }
                
                return dateB - dateA; // En yeni tarih en üstte olacak
            });
        }

        /* YOUTUBE CANLI VERİ ÇEKME - KALİTE YÜKSELTME SİSTEMLİ */
        const YOUTUBE_CHANNEL_ID = "UCYdaRUfmpir19Tp3W4X8spg"; 
        
        async function fetchYouTubeVideos() {
            const videosContainer = document.getElementById('latest-videos-container');
            
            try {
                const rssUrl = encodeURIComponent(`https://www.youtube.com/feeds/videos.xml?channel_id=${YOUTUBE_CHANNEL_ID}`);
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;
                
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if (data.status === 'ok' && data.items.length > 0) {
                    const latestVideos = data.items.slice(0, 6); // 6 video çekiyoruz
                    
                    videosContainer.innerHTML = latestVideos.map(vid => {
                        const pubDate = new Date(vid.pubDate).toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
                        
                        // Video ID'sini Linkten Alıp En Yüksek Çözünürlüklü Fotoğrafı Çağırma Sistemi
                        const videoIdMatch = vid.link.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);
                        const videoId = videoIdMatch ? videoIdMatch[1] : null;
                        
                        // HD görsel URL'si (Bulunamazsa standart RSS resmi devreye girer)
                        const hdThumbnailUrl = videoId ? `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg` : vid.thumbnail;
                        const fallbackThumbnailUrl = videoId ? `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg` : vid.thumbnail;
                        
                        return `
                        <!-- max-w-[450px] ile kutuların maksimum genişliğini daralttık -->
                        <a href="${vid.link}" target="_blank" class="group bg-gray-900 border border-gray-800 rounded-lg overflow-hidden hover:border-gray-500 transition flex flex-col w-full max-w-[450px]">
                            <div class="relative aspect-video w-full overflow-hidden bg-black">
                                <img src="${hdThumbnailUrl}" onerror="this.onerror=null; this.src='${fallbackThumbnailUrl}';" alt="${vid.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                                    <i class="fa-brands fa-youtube text-5xl text-red-600 drop-shadow-md"></i>
                                </div>
                            </div>
                            <div class="p-4 flex flex-col flex-grow">
                                <h3 class="font-bold text-gray-200 group-hover:text-white line-clamp-2 mb-2 text-lg md:text-xl">${vid.title}</h3>
                                <span class="text-sm text-gray-500 mt-auto"><i class="fa-regular fa-clock mr-1"></i>${pubDate}</span>
                            </div>
                        </a>
                        `
                    }).join('');
                } else {
                    videosContainer.innerHTML = `<div class="col-span-full text-center py-6 text-gray-500">Videolar şu an yüklenemedi.</div>`;
                }
            } catch (error) {
                console.error("YouTube veri çekme hatası:", error);
                videosContainer.innerHTML = `
                    <div class="col-span-full text-center py-6 text-gray-500">Videolar yüklenirken bir sorun oluştu.</div>`;
            }
        }

        /* =========================================
           3. SAYFA VE SEKME İŞLEVLERİ
           ========================================= */
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            window.scrollTo(0,0);
        }

        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        
        function toggleMobileMenu() {
            mobileMenu.classList.toggle('hidden');
        }
        mobileMenuBtn.addEventListener('click', toggleMobileMenu);

        function loadHomeContent() {
            fetchYouTubeVideos();
            loadLatestArticlesCarousel();
        }

        function loadLatestArticlesCarousel() {
            const marqueeContainer = document.getElementById('latest-articles-marquee');
            if(articlesData.length === 0) {
                marqueeContainer.innerHTML = '<div class="text-gray-500 p-4">Henüz yazı bulunmuyor.</div>';
                return;
            }

            // Kayan yazılar bölümünde de en yeni yazıları öne alıyoruz
            const sortedArticles = getSortedArticles(articlesData);

            const articlesHTML = sortedArticles.map(article => `
                <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 hover:border-gray-500 transition flex flex-col cursor-pointer w-[300px] shrink-0 whitespace-normal" onclick="openArticle(${article.id})">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded uppercase">${article.category}</span>
                        <span class="text-[10px] text-gray-500">${article.date}</span>
                    </div>
                    <h3 class="text-lg font-bold mb-2 text-gray-100 line-clamp-2">${article.title}</h3>
                    <p class="text-gray-400 text-sm mb-4 line-clamp-3 overflow-hidden text-ellipsis">${article.summary}</p>
                    <div class="mt-auto text-xs font-bold text-gray-300">Şimdi Oku &rarr;</div>
                </div>
            `).join('');

            marqueeContainer.innerHTML = articlesHTML.repeat(4);
        }

        function goToCategory(category) {
            switchTab('articles');
            filterArticles(category);
        }

        function filterArticles(category) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                if(btn.innerText === category) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            const filteredData = category === 'Tümü' 
                ? articlesData 
                : articlesData.filter(article => article.category === category);

            const articlesContainer = document.getElementById('articles-container');
            if(filteredData.length === 0) {
                articlesContainer.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500">Bu kategoride henüz yazı bulunmuyor.</div>`;
                return;
            }
            
            // "Yazılar ve İncelemeler" kısmında tarihe göre sıralayarak ekrana bastırıyoruz
            const sortedData = getSortedArticles(filteredData);

            articlesContainer.innerHTML = sortedData.map(article => `
                <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 hover:border-gray-500 transition flex flex-col h-full cursor-pointer" onclick="openArticle(${article.id})">
                    <div class="flex items-center gap-2 mb-4">
                        <span class="bg-red-600 text-white text-xs font-bold px-2 py-1 rounded uppercase">${article.category}</span>
                        <span class="text-xs text-gray-500">${article.date}</span>
                    </div>
                    <h3 class="text-xl font-bold mb-3 text-gray-100">${article.title}</h3>
                    <p class="text-gray-400 text-sm mb-6 flex-grow">${article.summary}</p>
                    <button class="text-left text-sm font-bold text-gray-300 hover:text-white mt-auto flex items-center">
                        Devamını Oku <i class="fa-solid fa-arrow-right ml-2 text-xs"></i>
                    </button>
                </div>
            `).join('');
        }

        /* YAZI OKUMA, GÖRÜNTÜLENME VE PAYLAŞMA SİSTEMİ */
        function openArticle(id) {
            currentOpenArticleId = id;
            const article = articlesData.find(a => a.id === id);
            if(!article) return;

            document.getElementById('modal-category').innerText = article.category;
            document.getElementById('modal-date').innerText = article.date;
            document.getElementById('modal-title').innerText = article.title;
            document.getElementById('modal-content').innerHTML = article.content;

            // Okunma Sayısını Getir ve Artır
            const viewsEl = document.getElementById('modal-views');
            viewsEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; 
            
            fetch(`https://api.counterapi.dev/v1/dyml02_site/article_${id}/up`)
                .then(response => response.json())
                .then(data => {
                    viewsEl.innerHTML = `<i class="fa-solid fa-eye"></i> ${data.count}`;
                })
                .catch(error => {
                    viewsEl.innerHTML = `<i class="fa-solid fa-eye"></i> -`; 
                });
            
            document.getElementById('article-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            try {
                // Link ismini yazı başlığı (slug) ile değiştir
                const articleSlug = createSlug(article.title);
                window.location.hash = articleSlug;
            } catch (e) {
                console.log("Önizleme modunda URL değiştirme işlemi atlandı.");
            }
        }

        function closeArticle() {
            currentOpenArticleId = null;
            document.getElementById('article-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';

            try {
                window.location.hash = '';
            } catch (e) {
                console.log("Önizleme modunda URL değiştirme işlemi atlandı.");
            }
        }

        // Paylaşma Fonksiyonu (Bağlantı Kopyalama)
        async function shareArticle() {
            const article = articlesData.find(a => a.id === currentOpenArticleId);
            if (!article) return;

            const shareUrl = window.location.href; 
            const shareBtn = document.querySelector('button[onclick="shareArticle()"]');
            const originalHTML = shareBtn.innerHTML;

            try {
                await navigator.clipboard.writeText(shareUrl);
                
                shareBtn.innerHTML = '<i class="fa-solid fa-check"></i> Kopyalandı!';
                shareBtn.classList.add('text-green-400');
                
                setTimeout(() => {
                    shareBtn.innerHTML = originalHTML;
                    shareBtn.classList.remove('text-green-400');
                }, 2000);
            } catch (err) {
                const tempInput = document.createElement('input');
                tempInput.value = shareUrl;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                
                shareBtn.innerHTML = '<i class="fa-solid fa-check"></i> Kopyalandı!';
                shareBtn.classList.add('text-green-400');
                
                setTimeout(() => {
                    shareBtn.innerHTML = originalHTML;
                    shareBtn.classList.remove('text-green-400');
                }, 2000);
            }
        }

        /* BAŞLANGIÇ AYARLARI VE LİNKTEN GELENLERİ YAKALAMA */
        window.onload = () => {
            loadHomeContent();
            filterArticles('Tümü');

            // Eğer siteye dışarıdan özel bir linkle gelindiyse yazıyı otomatik aç
            const hash = decodeURIComponent(window.location.hash.substring(1));
            if (hash) {
                // Eğer eski sistem "yazi-X" linkleriyle gelen varsa diye kontrol
                if (hash.startsWith('yazi-')) {
                    const articleId = parseInt(hash.replace('yazi-', ''));
                    if (!isNaN(articleId)) {
                        switchTab('articles');
                        openArticle(articleId);
                    }
                } else {
                    // Yeni sistem: Yazının başlığıyla (slug) eşleşen yazıyı bul
                    const article = articlesData.find(a => createSlug(a.title) === hash);
                    if (article) {
                        switchTab('articles');
                        openArticle(article.id);
                    }
                }
            }
        };

    </script>
</body>
